services:
  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: finspectra-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://finspectra:finspectra_dev@postgres:5432/finspectra
      - GRAPH_BACKEND=neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=finspectra_password
      - JWT_SECRET=finspectra-production-secret-key-minimum-32-chars!!
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped

  # React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: finspectra-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: finspectra-postgres
    environment:
      POSTGRES_USER: finspectra
      POSTGRES_PASSWORD: finspectra_dev
      POSTGRES_DB: finspectra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finspectra -d finspectra"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Neo4j Graph Database Service
  neo4j:
    image: neo4j:5-community
    container_name: finspectra-neo4j
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/finspectra_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
